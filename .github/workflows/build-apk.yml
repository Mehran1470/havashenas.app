name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: npx @capacitor/assets generate --android
      - name: Add weather widget files
        run: |
          mkdir -p android/app/src/main/java/com/havashenas/hormozgan
          cp widget/WeatherWidgetProvider.java android/app/src/main/java/com/havashenas/hormozgan/WeatherWidgetProvider.java
          cp widget/CityWidgetPlugin.java android/app/src/main/java/com/havashenas/hormozgan/CityWidgetPlugin.java
          cp widget/MainActivity.java android/app/src/main/java/com/havashenas/hormozgan/MainActivity.java
          cp widget/WeatherNotificationService.java android/app/src/main/java/com/havashenas/hormozgan/WeatherNotificationService.java
          cp widget/weather_widget_layout.xml android/app/src/main/res/layout/weather_widget_layout.xml
          cp widget/notification_layout.xml android/app/src/main/res/layout/notification_layout.xml
          cp widget/widget_background.xml android/app/src/main/res/drawable/widget_background.xml
          cp widget/widget_background_dark.xml android/app/src/main/res/drawable/widget_background_dark.xml
          cp widget/widget_background_sunset.xml android/app/src/main/res/drawable/widget_background_sunset.xml
          mkdir -p android/app/src/main/res/xml
          cp widget/weather_widget_info.xml android/app/src/main/res/xml/weather_widget_info.xml
          python3 -c "
          content = open('android/app/src/main/AndroidManifest.xml').read()
          receiver = open('widget/manifest_receiver.xml').read()
          perms = open('widget/manifest_permissions.xml').read()
          content = content.replace('</application>', receiver + '\n    </application>')
          content = content.replace('<application', perms + '\n    <application')
          open('android/app/src/main/AndroidManifest.xml', 'w').write(content)
          "
        
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: havashenas-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
